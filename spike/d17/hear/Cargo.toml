[package]
name = "hear"
version = "0.0.0"
edition = "2021"
publish = false
description = "D17's spike: speech engines behind one listener, measured on the same clips"

# Not part of any workspace: the spike stands alone, as D16's did.
[workspace]

[features]
default = ["sherpa-static"]
# sherpa-onnx linked in (as the desktop shell would), or as its shared libraries: whisper.cpp and
# Vosk crash beside the static build (their own copies of what it bundles), so they use the shared.
sherpa-static = ["sherpa-onnx/static"]
sherpa-shared = ["sherpa-onnx/shared"]
# whisper.cpp, built from source with CMake.
whisper = ["dep:whisper-rs"]
# Vosk, against the libvosk.so that fetch-models.sh puts in ../lib.
vosk = ["dep:vosk"]
# The microphone, for trying an engine live.
mic = ["dep:cpal"]

[dependencies]
sherpa-onnx = { version = "2.0.0", default-features = false }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
whisper-rs = { version = "0.16", optional = true }
vosk = { version = "0.3.1", optional = true }
cpal = { version = "0.18", optional = true }

[profile.release]
debug = false

[[bin]]
name = "live"
required-features = ["mic"]
