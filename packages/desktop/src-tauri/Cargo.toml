[package]
name = "writer"
version = "0.1.0"
description = "Writer's desktop app: the server bundle on its own Node and git, in a window (D9)"
license = "MIT"
authors = ["Jeff Wikstrom"]
repository = "https://github.com/heffrey78/writer"
edition = "2024"
rust-version = "1.85"

[lib]
name = "writer_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dictation (#83, D17): Writer's speech crate with the microphone, and the model's download.
writer-dictation = { path = "../../dictation", features = ["mic", "download"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal"] }

# The window's own webview, for its editing commands (the version wry uses).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
