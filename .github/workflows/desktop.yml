name: Desktop

# The desktop app's Linux packages (heffrey78/gh-writer#193): the .deb, built on Ubuntu, and the Arch package made from
# it; each installed on a clean machine with no git and smoke-tested (scripts/smoke-desktop.ts). A
# release tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) also drafts a GitHub Release with them and
# git's source. Publishing the draft is the owner's: the app offers the latest published release.
#
# Windows and Apple-silicon Mac test builds (#106): unsigned (signing is #88 and #89), built and
# smoke-tested on GitHub's runners, on the same triggers. Run by hand on main, they replace the assets
# of the "Desktop (test builds)" pre-release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packages/desktop/**
      - scripts/build-server.ts
      - scripts/fetch-runtime.ts
      - scripts/build-smoke.ts
      - scripts/smoke-desktop.ts
      - scripts/check-version.ts
      - packages/dictation/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Build the .deb
    # The oldest Ubuntu Tauri builds for: the .deb then runs on it and everything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: The tag names the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.ts "$GITHUB_REF_NAME"
      - name: Install what Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: npm ci
      # sherpa-onnx's build keeps its download in target/, which the cache brings back emptied.
      - run: rm -rf packages/desktop/src-tauri/target/sherpa-onnx-prebuilt
        shell: bash
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/writer-runtime
          key: runtime-${{ hashFiles('scripts/fetch-runtime.ts') }}
      - name: The server bundle and the runtime (Node, git)
        run: |
          npm run build:server
          npm run fetch:runtime
      - name: The .deb
        run: npx tauri build --bundles deb
        working-directory: packages/desktop
      - name: The smoke test, bundled for a machine with only the app's Node
        run: |
          node scripts/build-smoke.ts dist/smoke
          node scripts/fetch-runtime.ts --versions > dist/smoke/versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: dist/smoke

  arch:
    name: Make the Arch package
    needs: deb
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/deb
      - name: makepkg, from the .deb, as a user (makepkg won't run as root)
        run: |
          useradd -m builder
          chown -R builder .
          deb=$(ls "$PWD"/dist/deb/*.deb)
          su builder -c "WRITER_DEB='$deb' packages/desktop/arch/build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packages/desktop/arch/*.pkg.tar.zst
          if-no-files-found: error

  smoke-deb:
    name: Smoke test on a clean Ubuntu
    needs: deb
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb
      - uses: actions/download-artifact@v4
        with:
          name: smoke
          path: smoke
      - name: Install the .deb with what it depends on, and a display to start it on; no git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/*.deb xvfb xauth dbus procps
          if command -v git; then echo "git came with something: the test needs a machine without it"; exit 1; fi
      - name: Sign in, clone, write, sync, quit; and start and quit the app
        # Containers can't give WebKit's web process its own sandbox (no user namespaces).
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: xvfb-run -a dbus-run-session -- /usr/lib/writer/runtime/node/node smoke/smoke-desktop.mjs --sample smoke/sample-novel --gui

  smoke-arch:
    name: Smoke test on a clean Arch
    needs: arch
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: arch
      - uses: actions/download-artifact@v4
        with:
          name: smoke
          path: smoke
      - name: Install the package with what it depends on, and a display to start it on; no git
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm arch/*.pkg.tar.zst
          pacman -S --noconfirm --needed xorg-server-xvfb xorg-xauth
          if command -v git; then echo "git came with something: the test needs a machine without it"; exit 1; fi
      - name: Sign in, clone, write, sync, quit; and start and quit the app
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: xvfb-run -a dbus-run-session -- /usr/lib/writer/runtime/node/node smoke/smoke-desktop.mjs --sample smoke/sample-novel --gui

  windows:
    name: Windows test build (unsigned), smoke-tested
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: npm ci
      # sherpa-onnx's build keeps its download in target/, which the cache brings back emptied.
      - run: rm -rf packages/desktop/src-tauri/target/sherpa-onnx-prebuilt
        shell: bash
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/writer-runtime
          key: runtime-win32-${{ hashFiles('scripts/fetch-runtime.ts') }}
      - name: The server bundle and the runtime (Node, MinGit)
        run: |
          npm run build:server
          npm run fetch:runtime
      - name: The installer (NSIS)
        run: npx tauri build --bundles nsis
        working-directory: packages/desktop
      - run: node scripts/build-smoke.ts dist/smoke
      - name: Installed for this user, as a writer would
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 2 -Filter writer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "The installer put no writer.exe in $env:LOCALAPPDATA" }
          "WRITER_ROOT=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          "WRITER_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem $exe.DirectoryName
      - name: Sign in, clone, write, sync, quit; and start and end the app
        shell: pwsh
        env:
          WRITER_SMOKE_ALLOW_GIT: "1"
          # The test shows the screen there if the app doesn't start: a Windows app says nothing on a console.
          WRITER_SMOKE_SCREEN: ${{ runner.temp }}\screen.png
        run: '& "$env:WRITER_ROOT\runtime\node\node.exe" dist/smoke/smoke-desktop.mjs --root "$env:WRITER_ROOT" --app "$env:WRITER_EXE" --sample dist/smoke/sample-novel --gui'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-screen
          path: ${{ runner.temp }}/screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    name: Apple-silicon Mac test build (unsigned), smoke-tested
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: npm ci
      # sherpa-onnx's build keeps its download in target/, which the cache brings back emptied.
      - run: rm -rf packages/desktop/src-tauri/target/sherpa-onnx-prebuilt
        shell: bash
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/writer-runtime
          key: runtime-darwin-${{ hashFiles('scripts/fetch-runtime.ts') }}
      - name: The server bundle and the runtime (Node, git)
        run: |
          npm run build:server
          npm run fetch:runtime
      - name: The .dmg (signed ad hoc, as Apple silicon needs; not notarized)
        run: npx tauri build --bundles dmg
        working-directory: packages/desktop
      - run: node scripts/build-smoke.ts dist/smoke
      - name: The app copied out of the .dmg, as a writer would
        run: |
          dmg=$(ls packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          cp -R "$RUNNER_TEMP"/dmg/*.app "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app=$(ls -d "$RUNNER_TEMP"/*.app | head -n 1)
          echo "WRITER_ROOT=$app/Contents/Resources" >> "$GITHUB_ENV"
          echo "WRITER_EXE=$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -n 1)" >> "$GITHUB_ENV"
          codesign -dv "$app" 2>&1 | head -n 5
      - name: Sign in, clone, write, sync, quit; and start and quit the app
        env:
          WRITER_SMOKE_ALLOW_GIT: "1"
        run: '"$WRITER_ROOT/runtime/node/node" dist/smoke/smoke-desktop.mjs --root "$WRITER_ROOT" --app "$WRITER_EXE" --sample dist/smoke/sample-novel --gui'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  test-builds:
    name: The "Desktop (test builds)" pre-release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: At this commit, with the installers under names that stay the same
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp artifacts/windows/*-setup.exe writer-windows-setup.exe
          cp artifacts/macos/*.dmg writer-macos-apple-silicon.dmg
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/desktop-test-builds" -f sha="$GITHUB_SHA" -F force=true > /dev/null 2>&1 \
            || gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/desktop-test-builds -f sha="$GITHUB_SHA" > /dev/null
          cat > notes.md <<NOTES
          Unsigned test builds of Writer's desktop app, from ${GITHUB_SHA::7}, built and smoke-tested on GitHub's Windows and Apple-silicon Mac runners. Not for everyone yet: signing comes with #88 and #89.

          **Windows** (writer-windows-setup.exe): SmartScreen warns about an unknown publisher. Choose More info, then Run anyway. It installs for you alone, with nothing else needed.

          **Mac with Apple silicon** (writer-macos-apple-silicon.dmg): drag Writer to Applications. macOS won't open it at first, as it isn't notarized: open System Settings › Privacy & Security and choose Open Anyway beside Writer (or run \`xattr -dr com.apple.quarantine /Applications/writer.app\`).

          Updated each time the Desktop workflow is run by hand on main. A pre-release, so the app's update check doesn't offer it.
          NOTES
          if gh release view desktop-test-builds > /dev/null 2>&1; then
            gh release edit desktop-test-builds --prerelease --title "Desktop (test builds)" --notes-file notes.md
          else
            gh release create desktop-test-builds --prerelease --verify-tag --title "Desktop (test builds)" --notes-file notes.md
          fi
          gh release upload desktop-test-builds writer-windows-setup.exe writer-macos-apple-silicon.dmg --clobber

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, arch, smoke-deb, smoke-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: git's complete source (GPL-2.0), as the app's licenses/git-SOURCE.txt promises
        run: |
          git_version=$(jq -r .git artifacts/smoke/versions.json)
          dugite_tag=$(jq -r .gitTag artifacts/smoke/versions.json)
          curl -sSfLo "git-$git_version.tar.xz" "https://www.kernel.org/pub/software/scm/git/git-$git_version.tar.xz"
          curl -sSfLo "dugite-native-$dugite_tag.tar.gz" "https://github.com/desktop/dugite-native/archive/refs/tags/$dugite_tag.tar.gz"
      - name: A draft release, with the packages and git's source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=$([[ "$version" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag \
            --title "Writer $version" --generate-notes \
            artifacts/deb/*.deb artifacts/arch/*.pkg.tar.zst git-*.tar.xz dugite-native-*.tar.gz
