name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - USER.md
      - DEVELOPER.md
      - "packages/*/README.md"
      - docs/architecture/**
  pull_request:
    paths-ignore:
      - README.md
      - USER.md
      - DEVELOPER.md
      - "packages/*/README.md"
      - docs/architecture/**

# A newer push makes a run for an older commit on the same branch moot: it includes that commit.
# Cancelling it saves Actions minutes, which a private repository on the free plan has 2,000 of a month.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate sample novel
        run: npm run validate -- examples/sample-novel
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check the sample novel's EPUB with epubcheck
        run: |
          node scripts/compile-sample.ts dist/sample
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/sample/the-bridge-at-varn.epub

  # The git port over libgit2 (D16), as Android runs it: built, and held to the same contract as git;
  # and the Android app's other ports (files, the sealed token, templates), which need no Tauri to test.
  git2-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/git2-port
            packages/mobile/ports
      - run: npm ci
      - run: cargo build --release && cargo test --release --lib
        working-directory: packages/git2-port
      - name: The contract suite, against git and libgit2
        run: npx vitest run packages/server/test/git-port.test.ts
      - run: cargo test
        working-directory: packages/mobile/ports

  dictation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/dictation
      # The speech model (208 MB installed, 420 MB to download), kept until the manifest changes.
      - uses: actions/cache@v4
        with:
          path: packages/dictation/models
          key: dictation-models-${{ hashFiles('packages/dictation/src/model.rs') }}
      - run: ./fetch-models.sh && rm -rf models/downloads
        working-directory: packages/dictation
      - run: cargo test --release
        working-directory: packages/dictation
      # The microphone's part, which the tests don't open: it builds, and lists microphones right.
      - run: sudo apt-get install -y -qq libasound2-dev > /dev/null && cargo test --release --features mic --lib
        working-directory: packages/dictation

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: packages/editor
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            packages/editor/test-results/
            packages/web/test-results/
          retention-days: 7
