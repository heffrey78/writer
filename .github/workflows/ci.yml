name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - USER.md
      - DEVELOPER.md
      - "packages/*/README.md"
      - docs/architecture/**
  pull_request:
    paths-ignore:
      - README.md
      - USER.md
      - DEVELOPER.md
      - "packages/*/README.md"
      - docs/architecture/**

# A newer push makes a run for an older commit on the same branch moot: it includes that commit.
# Cancelling it saves Actions minutes, which a private repository on the free plan has 2,000 of a month.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate sample novel
        run: npm run validate -- examples/sample-novel
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check the sample novel's EPUB with epubcheck
        run: |
          node scripts/compile-sample.ts dist/sample
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/sample/the-bridge-at-varn.epub

  # The git port over libgit2 (D16), as Android runs it: built, and held to the same contract as git;
  # and the Android app's other ports (files, the sealed token, templates), which need no Tauri to test.
  git2-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/git2-port
            packages/mobile/ports
      - run: npm ci
      - run: cargo build --release && cargo test --release --lib
        working-directory: packages/git2-port
      - name: The contract suite, against git and libgit2
        run: npx vitest run packages/server/test/git-port.test.ts
      - run: cargo test
        working-directory: packages/mobile/ports

  dictation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/dictation
      # The speech model (208 MB installed, 420 MB to download), kept until the manifest changes.
      - uses: actions/cache@v4
        with:
          path: packages/dictation/models
          key: dictation-models-${{ hashFiles('packages/dictation/src/model.rs') }}
      - run: ./fetch-models.sh && rm -rf models/downloads
        working-directory: packages/dictation
      # sherpa-onnx's build keeps its download in target/, which the cache brings back emptied: a
      # build script that runs again (the microphone's features) would take it as there.
      - run: rm -rf target/sherpa-onnx-prebuilt
        working-directory: packages/dictation
      - run: cargo test --release
        working-directory: packages/dictation
      # The microphone's part, which the tests don't open: it builds, and lists microphones right;
      # and the model's download, against a server of the test's own.
      - run: sudo apt-get install -y -qq libasound2-dev > /dev/null && cargo test --release --features mic,download --lib
        working-directory: packages/dictation

  e2e:
    runs-on: ubuntu-24.04
    # A run takes half an hour; one that hangs stops here, not at GitHub's six.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browsers, and the Ubuntu packages they need, from the cache: Ubuntu's mirror has taken 47
      # minutes to hand over the packages. Saved as soon as they're in, whatever the tests do after.
      - id: browsers
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit
        run: |
          mkdir -p ~/apt-debs
          # apt installs the packages it has in its archive without downloading them, and keeps
          # what it downloads there, for the cache.
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2> /dev/null || true
          npx playwright install --with-deps chromium webkit
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2> /dev/null || true
        working-directory: packages/editor
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            packages/editor/test-results/
            packages/web/test-results/
          retention-days: 7

  # Writer for Android (#105): the phone's APK, built as packages/mobile/build.sh builds it here, on
  # the runner's Android SDK and NDK. Signed with the owner's debug key (the ANDROID_DEBUG_KEYSTORE
  # secret, base64), so it installs over the app on the phone and keeps its books.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRITER_ANDROID_ENV: given
      # The NDK the build is made with here (Unity's).
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri
      - name: The NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ -d "$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: npm ci
      - name: The owner's debug key, where Gradle signs a debug build with it
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::warning::No ANDROID_DEBUG_KEYSTORE: the APK is signed with a new key, and won't install over the phone's app."; exit 0; }
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          # Named to Gradle (build.sh): on the runner its default place for the key isn't ~/.android.
          echo "WRITER_ANDROID_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      # sherpa-onnx's build keeps its download in target/, which the cache brings back emptied (as in
      # the dictation job), and the cache says its build script has run: it's made to run again, to
      # download it afresh.
      - run: |
          rm -rf packages/mobile/src-tauri/target/sherpa-onnx-prebuilt
          cargo clean --manifest-path packages/mobile/src-tauri/Cargo.toml --target aarch64-linux-android -p sherpa-onnx-sys
      - run: packages/mobile/build.sh aarch64
      - name: Signed with the owner's key, or it isn't published
        id: signer
        run: |
          apk=$(find packages/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$apk" writer-android.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          digest=$("$apksigner" verify --print-certs writer-android.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Signed by $digest"
          [ "$digest" = b51ee4d85ea649d5907f59743726c6a3365369c6e28319ca737f4eae37616fb2 ] && echo "owner=true" >> "$GITHUB_OUTPUT" || echo "owner=false" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: writer-android.apk
          if-no-files-found: error
          retention-days: 14
    outputs:
      owner: ${{ steps.signer.outputs.owner }}

  # Once everything else on main has passed: the APK at a fixed address, in the "Android (latest)"
  # pre-release, for the phone's browser to download. A pre-release, so the desktop app's update
  # check doesn't offer it.
  android-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, git2-port, dictation, e2e, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Signed with the owner's key
        if: needs.android.outputs.owner != 'true'
        run: |
          echo "::error::The APK isn't signed with the owner's debug key (ANDROID_DEBUG_KEYSTORE): it wouldn't install over the phone's app."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: The pre-release, at this commit, with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, never into the script: it's the commit's own text.
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null 2>&1 \
            || gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/android-latest -f sha="$GITHUB_SHA" > /dev/null
          notes=$(printf '%s\n\n%s\n\n%s' \
            "Writer for Android, built from ${GITHUB_SHA::7} on $(date -u +'%-d %B %Y, %H:%M UTC'): ${MESSAGE%%$'\n'*}" \
            "Open writer-android.apk on the phone to install it over Writer: your books are kept. The first time, Android asks to allow installing from the browser." \
            "Updated by every push to main that passes CI. It's a pre-release, so the desktop app doesn't offer it as an update.")
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --prerelease --title "Android (latest)" --notes "$notes"
          else
            gh release create android-latest --prerelease --verify-tag --title "Android (latest)" --notes "$notes"
          fi
          gh release upload android-latest writer-android.apk --clobber
